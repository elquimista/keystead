[package]
name = "keystead-cli"
description = "keystead command-line tool with pass-style commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "keystead_cli"
path = "src/lib.rs"

[[bin]]
name = "keystead"
path = "src/main.rs"

[dependencies]
keystead-client = { path = "../keystead-client" }
keystead-core.workspace = true
anyhow.workspace = true
clap.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
keystead-server.workspace = true
axum.workspace = true
tokio.workspace = true

[lints]
workspace = true
