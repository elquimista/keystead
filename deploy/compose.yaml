# The Keystead server for a deployment behind nginx on the same machine. It runs the
# image published from this repository's release tags, and listens only on the machine's
# own 127.0.0.1, so nothing but nginx can reach it. See deploy/README.md.
#
#   cp .env.example .env     # pin KEYSTEAD_VERSION; change KEYSTEAD_PORT if 8080 is taken
#   docker compose up -d

# A fixed project name, so the data volume is always keystead_keystead-data, whatever the
# checkout's folder is called.
name: keystead

services:
  server:
    # The release in .env, never whatever is newest: an update is a choice.
    image: ghcr.io/elquimista/keystead-server:${KEYSTEAD_VERSION:?set KEYSTEAD_VERSION in .env, as in .env.example}
    ports:
      - "127.0.0.1:${KEYSTEAD_PORT:-8080}:8080"
    volumes:
      - keystead-data:/data
    restart: unless-stopped
    # Nothing on the image changes while it runs: it writes only its database, in the
    # volume. It needs no Linux capabilities, and can't gain any.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  keystead-data:
