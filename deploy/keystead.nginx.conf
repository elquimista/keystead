# nginx in front of the Keystead server, with Cloudflare in front of nginx. See
# deploy/README.md.
#
# Replace keys.example.com with your domain. Cloudflare connects over HTTPS only (SSL/TLS
# mode "Full (strict)"), with this machine presenting a Cloudflare Origin CA certificate.
# Cloudflare redirects plain HTTP itself ("Always Use HTTPS"), so there's no port 80 block.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keys.example.com;

    # The Origin CA certificate and key from Cloudflare (SSL/TLS > Origin Server).
    ssl_certificate     /etc/ssl/keystead/origin.pem;
    ssl_certificate_key /etc/ssl/keystead/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Clients that honour it never fall back to plain HTTP once they've seen HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # The server accepts request bodies of up to 2 MB.
    client_max_body_size 2m;

    location / {
        # The port is KEYSTEAD_PORT from deploy/.env.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
