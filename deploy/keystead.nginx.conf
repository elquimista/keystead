# nginx in front of the Keystead server, with Cloudflare in front of nginx. See
# deploy/README.md.
#
# Replace keys.example.com with your domain. Cloudflare connects over HTTPS only (SSL/TLS
# mode "Full (strict)"), with this machine presenting a Cloudflare Origin CA certificate.
# Cloudflare redirects plain HTTP itself ("Always Use HTTPS"), so there's no port 80 block.

# The Keystead server. The port is KEYSTEAD_PORT from deploy/.env.
upstream keystead_server {
    server 127.0.0.1:8080;
    # Connections to the server stay open for the next request, rather than one each.
    keepalive 16;
}

# Limits for each client address, so one address can't flood the server. Cloudflare gives
# the client's address in CF-Connecting-IP. That can be believed only because nothing but
# Cloudflare reaches this nginx (step 4 of deploy/README.md); a request without it is
# counted under the address that connected.
map $http_cf_connecting_ip $keystead_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
# What anyone can call without signing in: signing in, joining with an invite, setup and
# recovery. A whole office behind one address unlocking at once stays well inside it.
limit_req_zone $keystead_client zone=keystead_open:10m rate=10r/s;
# Everything, signed in or not.
limit_req_zone $keystead_client zone=keystead_all:10m rate=50r/s;

# Anything that isn't for keys.example.com. The firewall lets in only Cloudflare, but any
# Cloudflare customer can point their own domain at this machine, and their requests come
# from Cloudflare's addresses too, past your Cloudflare rules. Those requests, and any
# other name, get no answer: nginx closes the connection (444). Only Cloudflare's
# Enterprise plan can make it send your domain's name instead; Authenticated Origin Pulls
# (below) stops that too.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/keystead/origin.pem;
    ssl_certificate_key /etc/ssl/keystead/origin.key;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keys.example.com;

    # The Origin CA certificate and key from Cloudflare (SSL/TLS > Origin Server).
    ssl_certificate     /etc/ssl/keystead/origin.pem;
    ssl_certificate_key /etc/ssl/keystead/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Cloudflare picks up where it left off rather than with a full handshake each time.
    ssl_session_cache shared:keystead_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls, optional: Cloudflare shows a client certificate of your
    # own on every connection, so only requests through your zone get in. Set it up in
    # Cloudflare first (step 4 of deploy/README.md), then uncomment, with "optional" until
    # the app works through it, then "on".
    # ssl_client_certificate /etc/ssl/keystead/origin-pull-ca.pem;
    # ssl_verify_client on;

    # Clients that honour it never fall back to plain HTTP once they've seen HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # The server accepts request bodies of up to 2 MB.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    # Lets the connections to the server stay open (keepalive, above).
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Over a limit, the answer is 429 (too many requests) and the server isn't asked.
    limit_req_status 429;
    limit_req zone=keystead_all burst=500 nodelay;

    location / {
        proxy_pass http://keystead_server;
    }

    location ~ ^/v1/(setup|sign-in|sign-in/challenge|invites/accept|recover|recover/challenge|recovery/claim|recovery/state|device-transfers/join|device-transfers/claim)$ {
        limit_req zone=keystead_open burst=200 nodelay;
        limit_req zone=keystead_all burst=500 nodelay;
        proxy_pass http://keystead_server;
    }
}
