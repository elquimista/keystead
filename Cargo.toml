[workspace]
resolver = "3"
members = ["crates/*", "prototypes/change-feed", "prototypes/unlock-search"]

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
bip39 = { version = "2", features = ["zeroize"] }
keystead-core = { path = "crates/keystead-core" }
keystead-server = { path = "crates/keystead-server" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
hpke = "0.12"
keepass = "0.17"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rpassword = "7"
# TLS as ureq already uses it (ring, no aws-lc), to verify servers with the operating
# system's trust settings through rustls-platform-verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# The Argon2 keepass uses, to choose its settings for exports.
rust-argon2 = "3"
# The login Keychain, for the CLI's keys on a Mac.
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "sqlite"] }
# Comparisons that take the same time whatever the values, for the setup code.
subtle = "2"
totp-rs = { version = "5.7", features = ["otpauth", "zeroize"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uniffi = "0.32"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }
# Dropbox's password strength estimator, for password health.
zxcvbn = { version = "3", default-features = false }

# The Mac app's core, linked into the app: one optimizing pass over all of it (link-time
# optimization) makes it smaller and a little faster. A profile of its own, so the server's
# and the CLI's builds stay quick. apps/macos/scripts/build-core.sh uses it for Release.
[profile.app]
inherits = "release"
lto = true
codegen-units = 1

# Unoptimized Argon2 takes many seconds per KeePass file, which tests export and import.
[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.blake2b_simd]
opt-level = 3

# Unoptimized, estimating a password's strength takes long enough to slow tests down.
[profile.dev.package.zxcvbn]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
