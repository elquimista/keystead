[workspace]
resolver = "3"
members = ["crates/*", "prototypes/change-feed", "prototypes/unlock-search"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
bip39 = { version = "2", features = ["zeroize"] }
keystead-core = { path = "crates/keystead-core" }
keystead-server = { path = "crates/keystead-server" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hpke = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "sqlite"] }
totp-rs = { version = "5.7", features = ["otpauth", "zeroize"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
uniffi = "0.32"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
