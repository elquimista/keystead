[workspace]
resolver = "3"
members = ["crates/*", "prototypes/change-feed", "prototypes/unlock-search"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
keystead-core = { path = "crates/keystead-core" }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
