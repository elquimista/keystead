[package]
name = "keystead-proto-unlock-search"
description = "Prototype: unlock and search speed for generated vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "unlock-search"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hpke.workspace = true
nucleo-matcher = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
