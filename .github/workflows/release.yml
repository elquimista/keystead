name: Release

# Pushing a version tag (v0.1.0) publishes the server image to the GitHub Container
# Registry as ghcr.io/<owner>/keystead-server, for linux/amd64 and linux/arm64, tagged
# 0.1.0, 0.1 and latest, and attaches the Mac app to the tag's GitHub release, with the
# version's notes from CHANGELOG.md. The tag must match the version in all three places the
# release checklist names, a final release needs its notes, and CI must pass on the tagged
# commit first. The image doesn't wait for the Mac app, whose macOS runner can queue for a
# long time.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the tag matches the version everywhere it's kept
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml says $VERSION; tag v$VERSION instead."
            exit 1
          fi
          # Apps carry only the numbers: 0.3.0 for 0.3.0-rc.1.
          APP_VERSION=$(sed -n 's/^MARKETING_VERSION = *//p' apps/macos/Config/Base.xcconfig)
          if [ "$APP_VERSION" != "${VERSION%%-*}" ]; then
            echo "::error::apps/macos/Config/Base.xcconfig says MARKETING_VERSION = $APP_VERSION, not ${VERSION%%-*}."
            exit 1
          fi
          # Servers are pointed at final releases only.
          DEPLOY_VERSION=$(sed -n 's/^KEYSTEAD_VERSION=//p' deploy/.env.example)
          if [[ "$VERSION" != *-* && "$DEPLOY_VERSION" != "$VERSION" ]]; then
            echo "::error::deploy/.env.example says KEYSTEAD_VERSION=$DEPLOY_VERSION, not $VERSION."
            exit 1
          fi
          # A final release says what it changes; a pre-release may.
          if [[ "$VERSION" != *-* ]] && ! grep -qx "## $VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## $VERSION\" section; add the release's notes there."
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  # The Mac app on the tagged commit, zipped for the mac-release job. The server image
  # doesn't wait for it.
  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      publish: true
    # The signing certificate, MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD, comes
    # from the `release` environment its job names; the repository keeps no copy of it.
    secrets: inherit

  # Attaches the Mac app and its checksum to the tag's GitHub release once CI has passed,
  # making the release if there isn't one yet: the version's notes from CHANGELOG.md, then
  # install notes. Its build provenance is
  # recorded too, so anyone can check this workflow built the zip from the tag. Signed with
  # the owner's Apple Development certificate, not notarized, until there's a Developer ID
  # certificate: see README.md.
  mac-release:
    needs: [version, ci, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-app
          path: mac-app
      - name: Record how it was built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: mac-app/*.zip
      - name: Write the notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # What changed: the lines under "## <version>" in CHANGELOG.md, up to the next
          # version's heading, without the blank lines around them. None for a pre-release
          # that has no section. GitHub shows line breaks in a release as they are, so
          # paragraphs here, as there, are one line each.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && /^[[:space:]]*$/ { if (started) blank++; next }
            found { while (blank > 0) { print ""; blank-- } print; started = 1 }
          ' CHANGELOG.md > changes.md
          if [ -s changes.md ]; then
            { cat changes.md; echo; } > notes.md
          fi
          cat >> notes.md <<EOF
          ## Mac app

          Download **Keystead-$VERSION.zip**, open it, and move Keystead to Applications. It runs on Macs with Apple silicon or Intel, on macOS 14 or later.

          It isn't notarized yet, so the first time it opens, macOS says it can't check it for malware. In System Settings › Privacy & Security, choose **Open Anyway** next to Keystead. Each new version asks once.

          To check the download, compare \`shasum -a 256 Keystead-$VERSION.zip\` with Keystead-$VERSION.zip.sha256, or confirm this repository's release workflow built it from this tag with \`gh attestation verify Keystead-$VERSION.zip --repo $GITHUB_REPOSITORY\`.

          ## Server

          \`ghcr.io/$OWNER/keystead-server:$VERSION\`: see [deploy/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/deploy/README.md) for updating.
          EOF
          cat notes.md
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Notes written by hand before this ran are kept; only the files are replaced.
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Keystead $VERSION" \
              --notes-file notes.md "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" mac-app/* --clobber
          gh release view "$GITHUB_REF_NAME" --json url,assets --jq '.url, .assets[].name'

  # Each platform builds natively on its own runner (emulating ARM to compile Rust is very
  # slow), checks the image starts and reports healthy, then pushes it by digest only.
  build:
    needs: [version, ci]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Name the image
        run: |
          # Registry names must be lowercase.
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/keystead-server" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${MATRIX_PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: keystead-server:test
      - name: Start it and wait until healthy
        run: |
          docker run -d --name keystead -p 127.0.0.1:8080:8080 keystead-server:test
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' keystead)" = healthy ] && break
            sleep 2
          done
          docker logs keystead
          curl --fail http://127.0.0.1:8080/v1/health
      - id: push
        name: Push by digest
        # The same build again, so it comes from the builder's cache.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the merge job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-platform images into one multi-platform image under the version tags.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the image
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/keystead-server" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # 0.1.0, 0.1 and latest; 1, 2 and so on once there's a 1.0. Pre-releases
          # (v0.2.0-rc.1) get only their own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Create the multi-platform image and tag it
        working-directory: ${{ runner.temp }}/digests
        run: |
          # "-t <tag>" for each version tag, and each platform's image by its digest.
          mapfile -t tags < <(jq -r '.tags[] | ("-t", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=The Keystead server" \
            "${sources[@]}"
      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"
