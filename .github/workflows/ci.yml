name: CI

# Not on pushes to main: CI runs on pull requests, on every release (the release workflow
# runs all of it on the tagged commit before publishing), and by hand from the Actions tab.
# The Mac app has its own workflow, macos.yml, which releases don't wait for.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Read-only: nothing here writes to the repository or publishes anything.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The locked dependencies against the RustSec advisory database as it is on the day, so a
  # new advisory stops the next pull request or release until it's dealt with.
  # .cargo/audit.toml lists the few known ones allowed, and why.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Also keeps the installed cargo-audit, so it's built once, not on every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the server image
        run: docker build -t keystead-server:ci .
      - name: Start it and wait until healthy
        run: |
          docker run -d --name keystead -p 127.0.0.1:8080:8080 keystead-server:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' keystead)" = healthy ] && break
            sleep 2
          done
          docker logs keystead
          curl --fail http://127.0.0.1:8080/v1/health
