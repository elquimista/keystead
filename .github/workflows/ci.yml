name: CI

# Not on pushes to main: CI runs on pull requests, on every release (the release workflow
# runs all of it on the tagged commit before publishing), and by hand from the Actions tab.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -t keystead-server:ci .
      - name: Start it and wait until healthy
        run: |
          docker run -d --name keystead -p 127.0.0.1:8080:8080 keystead-server:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' keystead)" = healthy ] && break
            sleep 2
          done
          docker logs keystead
          curl --fail http://127.0.0.1:8080/v1/health

  macos-app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Add the Intel target for a universal build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the Rust core
        run: scripts/build-core.sh
      - name: Build the app (Release, signed ad hoc)
        run: >
          xcodebuild -project Keystead.xcodeproj -scheme Keystead -configuration Release
          -derivedDataPath build/DerivedData build
      - name: Check the signature is ready for notarization
        run: |
          APP=build/DerivedData/Build/Products/Release/Keystead.app
          codesign --verify --strict --deep "$APP"
          codesign -dv "$APP" 2>&1 | grep -q 'runtime'
          ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP")
          echo "$ENTITLEMENTS" | grep -q 'com.apple.security.app-sandbox'
          ! echo "$ENTITLEMENTS" | grep -q 'get-task-allow'
      - name: Secure Enclave prototype tests
        run: swift test
        working-directory: prototypes/secure-enclave
